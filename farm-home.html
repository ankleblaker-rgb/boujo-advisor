(()=>{const home=document.getElementById('farm-home-panel'),settings=document.getElementById('farm-settings-panel'),a=document.getElementById('farm-home'),b=document.getElementById('farm-settings');document.getElementById('farm-home-date').textContent=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());function show(value){home.hidden=value;settings.hidden=!value;(value?b:a).setAttribute('aria-current','page');(value?a:b).removeAttribute('aria-current');document.querySelector('.farm-main').scrollTop=0}a.onclick=()=>show(false);b.onclick=()=>show(true);show(false)})();
