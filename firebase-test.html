<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Firebase接続テスト｜農業日誌AI</title><style>body{font-family:system-ui,sans-serif;background:#f5faf6;color:#173624;margin:0;padding:22px}main{max-width:640px;margin:auto;background:white;border-radius:16px;padding:24px;box-shadow:0 3px 20px #1232}h1{font-size:1.35rem}button{background:#18794e;color:white;border:0;border-radius:9px;padding:13px 18px;font-size:1rem;margin:7px 5px 7px 0}button:disabled{opacity:.45}#logout{background:#5b6570}pre{white-space:pre-wrap;word-break:break-word;background:#f0f5f1;padding:14px;border-radius:8px}small{color:#576c60}</style></head><body><main><h1>Firebase接続テスト</h1><p>防除アドバイザーとは独立した、Googleログインの動作確認ページです。散布履歴の読み書きは行いません。</p><p id="status">Firebaseを読み込み中…</p><button id="login" disabled>Googleでログイン</button><button id="logout" disabled>ログアウト</button><h2>ログイン結果</h2><pre id="result">未ログイン</pre><small>UIDは本人確認用の識別子です。公開のチャットに貼る場合は慎重に扱ってください。Firestoreは現在の全アクセス拒否ルールのまま維持してください。</small></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
const firebaseConfig={apiKey:'AIzaSyCKSWObv6oueliMX7bRhTTsAy3nS065Zvg',authDomain:'farm-ai-system.firebaseapp.com',projectId:'farm-ai-system',storageBucket:'farm-ai-system.firebasestorage.app',messagingSenderId:'469927403647',appId:'1:469927403647:web:cd05e7ddc50d33ac169f4a'};
const status=document.getElementById('status'),result=document.getElementById('result'),login=document.getElementById('login'),logout=document.getElementById('logout');
try{const auth=getAuth(initializeApp(firebaseConfig));const provider=new GoogleAuthProvider();onAuthStateChanged(auth,user=>{login.disabled=!!user;logout.disabled=!user;status.textContent=user?'Googleログイン成功':'未ログイン（ログインボタンを押してください）';result.textContent=user?`UID: ${user.uid}\nログイン状態: 成功\nメールアドレス: ${user.email||'取得なし'}`:'未ログイン';},err=>{status.textContent='認証状態の取得に失敗: '+err.message});login.disabled=false;login.onclick=async()=>{login.disabled=true;status.textContent='Googleログイン処理中…';try{await signInWithPopup(auth,provider)}catch(e){status.textContent='ログイン失敗: '+e.code+' / '+e.message;login.disabled=false}};logout.onclick=async()=>{try{await signOut(auth)}catch(e){status.textContent='ログアウト失敗: '+e.message}}}catch(e){status.textContent='初期化失敗: '+e.message}
</script></body></html>
